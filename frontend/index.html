<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eeee; --panel:#fff; --ink:#12302f; --muted:#5d7270; --line:#d3dcdb;
  --brand:#e1dcd6; --brand-ink:#fff; --warn:#f2c230; --warn-ink:#4a3a00;
  --bad:#c8372d; --bad-bg:#fbe6e3; --ok:#2f7d4f; --ok-bg:#e1f2e8;
  --radius:6px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1b1b; --panel:#162726; --ink:#e4efee; --muted:#93aaa8; --line:#27403e;
    --brand:#1d4a45; --brand-ink:#ffffff; --warn-ink:#f2c230; --bad-bg:#3a1c19; --ok-bg:#16301f; --ok:#6cc58e}
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Archivo,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:230px 1fr;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

aside{background:var(--brand);color:var(--brand-ink);padding:24px 18px;display:flex;flex-direction:column;gap:24px}
aside h1{margin:0;font-size:22px;letter-spacing:-.01em}
aside nav{display:flex;flex-direction:column;gap:4px}
aside nav button{background:none;border:0;color:inherit;text-align:left;padding:9px 12px;border-radius:var(--radius);cursor:pointer;opacity:.75}
aside nav button[aria-selected=true]{background:rgba(255,255,255,.16);opacity:1;font-weight:600}
aside label{font-size:13px;opacity:.8;display:block;margin-bottom:6px}
aside input{width:100%;padding:8px 10px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:inherit}
.conn{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#999}
.dot.on{background:#6be39a}.dot.off{background:#ff8a80}

main{padding:28px 32px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-size:28px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.stat.warn{border-left:5px solid var(--warn)}
.stat.bad{border-left:5px solid var(--bad)}

.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar input{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.btn{padding:9px 16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);cursor:pointer}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}

.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}
td.actions{text-align:right;display:flex;gap:6px;justify-content:flex-end}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.soon{background:var(--warn);color:#3b2f00}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.low{background:var(--bad-bg);color:var(--bad)}
.empty{padding:36px;text-align:center;color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);padding:0;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:22px;display:grid;gap:14px}
dialog h2{margin:0;font-size:19px}
dialog label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
dialog input,dialog select{padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.hint{font-size:12px;color:var(--muted);margin:0}

#toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:var(--radius);max-width:340px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#toast.err{background:var(--bad);color:#fff}

@media(max-width:820px){
  body{grid-template-columns:1fr}
  aside{padding:14px 16px;gap:12px}
  aside nav{flex-direction:row}
  main{padding:18px 14px}
  .stats{grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<aside>
  <h1>Estoque</h1>
  <nav role="tablist">
    <button role="tab" id="tab-produtos" aria-selected="true">Produtos</button>
    <button role="tab" id="tab-fornecedores" aria-selected="false">Fornecedores</button>
  </nav>
  <div>
    <label for="apiUrl">Endereço da API</label>
    <input id="apiUrl" type="url" value="http://localhost:3000">
    <div class="conn"><span class="dot" id="dot"></span><span id="connText">Verificando…</span></div>
  </div>
</aside>

<main>
  <section class="stats" id="stats"></section>
  <div class="bar">
    <input id="search" type="search" placeholder="Buscar por nome ou categoria">
    <button class="btn primary" id="addBtn">Novo produto</button>
  </div>
  <div class="tablewrap"><table id="table"></table></div>
</main>

<dialog id="dlg">
  <form id="form" method="dialog"></form>
</dialog>
<div id="toast" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
const state = { tab: 'produtos', produtos: [], fornecedores: [], editing: null };
let base = localStorage.getItem('apiUrl') || 'http://localhost:3000';
$('#apiUrl').value = base;

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day = (d) => (d ? String(d).slice(0, 10) : '');
const fmt = (d) => (d ? day(d).split('-').reverse().join('/') : '—');

async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch(base.replace(/\/$/, '') + path, {
      headers: { 'Content-Type': 'application/json' }, ...opts,
    });
  } catch {
    setConn(false);
    throw new Error('Não foi possível conectar à API. Confira o endereço e se o servidor está rodando com CORS ativado.');
  }
  setConn(true);
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const m = data?.message;
    throw new Error(Array.isArray(m) ? m.join(', ') : m || `Erro ${res.status}`);
  }
  return data;
}

function setConn(on) {
  $('#dot').className = 'dot ' + (on ? 'on' : 'off');
  $('#connText').textContent = on ? 'Conectado' : 'Sem conexão';
}

function toast(msg, err = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (t.className = ''), 3800);
}

async function load() {
  try {
    [state.produtos, state.fornecedores] = await Promise.all([api('/produto'), api('/fornecedor')]);
  } catch (e) {
    state.produtos = []; state.fornecedores = [];
    toast(e.message, true);
  }
  render();
}

// o campo "fornecedor" pode vir como objeto ou lista, dependendo do mapeamento da entidade
const fornOf = (p) => (Array.isArray(p.fornecedor) ? p.fornecedor[0] : p.fornecedor);

function status(p) {
  const hoje = new Date(day(new Date().toISOString()));
  const dias = Math.round((new Date(day(p.vencimento)) - hoje) / 864e5);
  if (dias < 0) return ['bad', 'Vencido'];
  if (dias <= 30) return ['soon', `Vence em ${dias} d`];
  return ['ok', 'Em dia'];
}

function render() {
  const ps = state.produtos;
  const venc = ps.filter((p) => status(p)[0] === 'bad').length;
  const soon = ps.filter((p) => status(p)[0] === 'soon').length;
  $('#stats').innerHTML = `
    <div class="stat"><b>${ps.length}</b><span>Produtos</span></div>
    <div class="stat"><b>${ps.reduce((a, p) => a + (Number(p.quantidade) || 0), 0)}</b><span>Unidades em estoque</span></div>
    <div class="stat warn"><b>${soon}</b><span>Vencem em até 30 dias</span></div>
    <div class="stat bad"><b>${venc}</b><span>Vencidos</span></div>`;

  const q = $('#search').value.trim().toLowerCase();
  const isProd = state.tab === 'produtos';
  $('#addBtn').textContent = isProd ? 'Novo produto' : 'Novo fornecedor';
  $('#search').placeholder = isProd ? 'Buscar por nome ou categoria' : 'Buscar por nome ou e-mail';
  $('#tab-produtos').setAttribute('aria-selected', isProd);
  $('#tab-fornecedores').setAttribute('aria-selected', !isProd);

  let head, rows;
  if (isProd) {
    head = ['Produto', 'Categoria', 'Qtd.', 'Fornecedor', 'Entrada', 'Vencimento', 'Situação', ''];
    rows = ps.filter((p) => `${p.nome} ${p.categoria}`.toLowerCase().includes(q)).map((p) => {
      const [cls, label] = status(p);
      const f = fornOf(p);
      const low = Number(p.quantidade) <= 5 ? ' <span class="tag low">Baixo</span>' : '';
      return `<tr><td>${esc(p.nome)}</td><td>${esc(p.categoria)}</td><td class="num">${esc(p.quantidade)}${low}</td>
        <td>${esc(f?.nome ?? '—')}</td><td>${fmt(p.dataEntrada)}</td><td>${fmt(p.vencimento)}</td>
        <td><span class="tag ${cls}">${label}</span></td>
        <td class="actions"><button class="btn sm" data-edit="${p.id}">Editar</button><button class="btn sm danger" data-del="${p.id}">Excluir</button></td></tr>`;
    });
  } else {
    head = ['Fornecedor', 'E-mail', ''];
    rows = state.fornecedores.filter((f) => `${f.nome} ${f.email}`.toLowerCase().includes(q)).map((f) =>
      `<tr><td>${esc(f.nome)}</td><td>${esc(f.email)}</td>
       <td class="actions"><button class="btn sm" data-edit="${f.id}">Editar</button><button class="btn sm danger" data-del="${f.id}">Excluir</button></td></tr>`);
  }
  $('#table').innerHTML = rows.length
    ? `<thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody>`
    : `<tbody><tr><td class="empty">${isProd ? 'Nenhum produto encontrado. Cadastre o primeiro com “Novo produto”.' : 'Nenhum fornecedor encontrado. Cadastre o primeiro com “Novo fornecedor”.'}</td></tr></tbody>`;
}

function openForm(item = null) {
  state.editing = item;
  const isProd = state.tab === 'produtos';
  const v = (k) => esc(item?.[k] ?? '');
  let html;
  if (isProd) {
    const cur = item ? fornOf(item)?.id : '';
    const opts = state.fornecedores.map((f) => `<option value="${f.id}" ${f.id === cur ? 'selected' : ''}>${esc(f.nome)}</option>`).join('');
    html = `<h2>${item ? 'Editar produto' : 'Novo produto'}</h2>
      <label>Nome<input name="nome" required value="${v('nome')}"></label>
      <div class="row">
        <label>Categoria<input name="categoria" required value="${v('categoria')}"></label>
        <label>Quantidade<input name="quantidade" type="number" min="0" required value="${v('quantidade')}"></label>
      </div>
      <label>Fornecedor<select name="fornecedorId" required ${item ? 'disabled' : ''}><option value="">Selecione…</option>${opts}</select></label>
      ${item ? '<p class="hint">O fornecedor não pode ser alterado depois do cadastro.</p>' : (state.fornecedores.length ? '' : '<p class="hint">Cadastre um fornecedor antes de criar produtos.</p>')}
      <div class="row">
        <label>Data de entrada<input name="dataEntrada" type="date" required value="${day(item?.dataEntrada)}"></label>
        <label>Vencimento<input name="vencimento" type="date" required value="${day(item?.vencimento)}"></label>
      </div>`;
  } else {
    html = `<h2>${item ? 'Editar fornecedor' : 'Novo fornecedor'}</h2>
      <label>Nome<input name="nome" required value="${v('nome')}"></label>
      <label>E-mail<input name="email" type="email" required value="${v('email')}"></label>`;
  }
  $('#form').innerHTML = html + `<div class="foot"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div>`;
  $('#cancel').onclick = () => $('#dlg').close();
  $('#dlg').showModal();
}

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const isProd = state.tab === 'produtos';
  const fd = Object.fromEntries(new FormData(e.target));
  const editing = state.editing;
  let body;
  if (isProd) {
    body = { nome: fd.nome, categoria: fd.categoria, quantidade: Number(fd.quantidade), dataEntrada: fd.dataEntrada, vencimento: fd.vencimento };
    if (!editing) body.fornecedorId = Number(fd.fornecedorId);
  } else {
    body = { nome: fd.nome, email: fd.email };
  }
  try {
    await api(`/${isProd ? 'produto' : 'fornecedor'}${editing ? '/' + editing.id : ''}`, { method: editing ? 'PUT' : 'POST', body: JSON.stringify(body) });
    $('#dlg').close();
    toast(editing ? 'Alterações salvas.' : 'Cadastro criado.');
    load();
  } catch (err) { toast(err.message, true); }
});

$('#table').addEventListener('click', async (e) => {
  const edit = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
  const list = state.tab === 'produtos' ? state.produtos : state.fornecedores;
  if (edit) openForm(list.find((i) => i.id === Number(edit.dataset.edit)));
  if (del) {
    const item = list.find((i) => i.id === Number(del.dataset.del));
    if (!confirm(`Excluir “${item.nome}”? Essa ação não pode ser desfeita.`)) return;
    try {
      await api(`/${state.tab === 'produtos' ? 'produto' : 'fornecedor'}/${item.id}`, { method: 'DELETE' });
      toast('Item excluído.');
      load();
    } catch (err) { toast(err.message, true); }
  }
});

document.querySelectorAll('[role=tab]').forEach((b) => b.addEventListener('click', () => {
  state.tab = b.id.replace('tab-', ''); $('#search').value = ''; render();
}));
$('#addBtn').onclick = () => openForm();
$('#search').oninput = render;
$('#apiUrl').onchange = (e) => { base = e.target.value; localStorage.setItem('apiUrl', base); load(); };

load();
</script>
</body>
</html>
